[package]
name = "ladder-rs-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Zanion"]
description = "WebAssembly bindings for the ladder-rs matchmaking library"
repository = "https://github.com/zanion/ladder-rs"
license = "MIT"
keywords = ["wasm", "webassembly", "matchmaking", "rating", "javascript"]
categories = ["wasm", "web-programming", "game-development"]

[lib]
crate-type = ["cdylib"]
name = "ladder_rs_wasm"

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance", "console"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }

[dependencies.ladder-rs]
path = "../"

# Fix getrandom for WASM builds
[dependencies.getrandom]
version = "0.2"
features = ["js"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
wee_alloc = ["dep:wee_alloc"]

# Default target is configured via command line flags in build scripts

[package.metadata.wasm-pack.profile.dev]
# Development profile - faster builds, easier debugging
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
# Production profile - maximum optimization
wasm-opt = ["-Oz", "--enable-mutable-globals"]

[package.metadata.wasm-pack.profile.profiling]
# Profiling profile - balanced optimization with debug info
wasm-opt = ["-O2", "--enable-mutable-globals"]

[profile.release]
# Enable maximum optimizations
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Single codegen unit for better optimization
strip = true        # Strip symbols for smaller size
panic = "abort"     # Smaller binary size

[profile.dev]
# Development profile
opt-level = 0
debug = true

[profile.wasm]
# Custom profile for WASM builds
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"