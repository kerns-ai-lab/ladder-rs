[package]
name = "ladder-rs-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Zanion"]
description = "WebAssembly bindings for the ladder-rs matchmaking library"
repository = "https://github.com/zanion/ladder-rs"
license = "MIT"
keywords = ["wasm", "webassembly", "matchmaking", "rating", "javascript"]
categories = ["wasm", "web-programming", "game-development"]

[lib]
crate-type = ["cdylib"]
name = "ladder_rs_wasm"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }

[dependencies.ladder-rs]
path = "../"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
wee_alloc = ["dep:wee_alloc"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]