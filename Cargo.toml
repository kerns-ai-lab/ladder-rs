[workspace]
members = [".", "ladder-rs-persistence", "ladder-rs-server", "wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zanion"]
license = "MIT"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
libm = "0.2"
rayon = "1.7"

[package]
name = "ladder-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance, extensible matchmaking library in Rust"
repository = "https://github.com/zanion/ladder-rs"
keywords = ["matchmaking", "rating", "trueskill", "elo", "glicko"]
categories = ["game-development", "algorithms"]

[dependencies]
thiserror.workspace = true
rand = { workspace = true, optional = true }
statrs = { version = "0.16", optional = true }
libm = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"
toml = "0.8"
rand.workspace = true
statrs = "0.16"

[features]
default = ["all-algorithms", "full-deps"]

# Algorithm selection features
elo-only = []
glicko-only = ["rand"]
trueskill-only = ["rand", "libm-math"]
all-algorithms = ["rand", "libm-math"]

# Math backend features
libm-math = ["libm"]       # Use libm for Gaussian functions (default, WASM-friendly)
statrs-math = ["statrs"]   # Use statrs for Gaussian functions (heavier, nalgebra dependency)

# Dependency features
full-deps = ["rayon", "chrono", "serde_json"]
minimal-wasm = ["elo-only"]  # Ultra-minimal for WASM

[[bench]]
name = "rating_update"
harness = false

[[bench]]
name = "algorithm_specific"
harness = false

[[bench]]
name = "integration_scenarios"
harness = false

# Examples
[[example]]
name = "elo_basic"
path = "examples/elo_basic.rs"

[[example]]
name = "glicko_basic"
path = "examples/glicko_basic.rs"

[[example]]
name = "trueskill_basic"
path = "examples/trueskill_basic.rs"

[[example]]
name = "rating_comparison"
path = "examples/rating_comparison.rs"
