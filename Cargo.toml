[package]
name = "ladder-rs"
version = "0.1.0"
edition = "2021"
authors = ["Zanion"]
description = "High-performance, extensible matchmaking library in Rust"
repository = "https://github.com/zanion/ladder-rs"
license = "MIT"
keywords = ["matchmaking", "rating", "trueskill", "elo", "glicko"]
categories = ["game-development", "algorithms"]

[dependencies]
thiserror = "1.0"
# Conditional dependencies for WASM optimization
rand = { version = "0.8", optional = true }
statrs = { version = "0.16", optional = true }
libm = { version = "0.2", optional = true }
rayon = { version = "1.7", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"
toml = "0.8"  # Added for WASM package structure tests
rand = "0.8"  # Always available for tests
statrs = "0.16"  # Always available for tests

[features]
default = ["all-algorithms", "full-deps"]

# Algorithm selection features
elo-only = []
glicko-only = ["rand"]
trueskill-only = ["rand", "libm-math"]
all-algorithms = ["rand", "libm-math"]

# Math backend features
libm-math = ["libm"]       # Use libm for Gaussian functions (default, WASM-friendly)
statrs-math = ["statrs"]   # Use statrs for Gaussian functions (heavier, nalgebra dependency)

# Dependency features
full-deps = ["rayon", "chrono", "serde_json"]
minimal-wasm = ["elo-only"]  # Ultra-minimal for WASM

[[bench]]
name = "rating_update"
harness = false

[[bench]]
name = "algorithm_specific"
harness = false

[[bench]]
name = "integration_scenarios"
harness = false

# Examples
[[example]]
name = "elo_basic"
path = "examples/elo_basic.rs"

[[example]]
name = "glicko_basic"
path = "examples/glicko_basic.rs"

[[example]]
name = "trueskill_basic"
path = "examples/trueskill_basic.rs"

[[example]]
name = "rating_comparison"
path = "examples/rating_comparison.rs"