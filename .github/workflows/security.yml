name: Security Audit

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Run security audit every day at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    - name: Run security audit
      run: |
        echo "🔍 Running security audit for vulnerabilities..."
        cargo audit --json > audit-report.json || true
        
        # Check if there are any vulnerabilities
        VULNS=$(jq '.vulnerabilities.count' audit-report.json)
        WARNINGS=$(jq '.warnings | length' audit-report.json)
        
        echo "Vulnerabilities found: $VULNS"
        echo "Warnings found: $WARNINGS"
        
        # Generate human-readable report
        echo "## 🛡️ Security Audit Report" > security-report.md
        echo "" >> security-report.md
        
        if [ "$VULNS" -eq 0 ]; then
          echo "✅ **No vulnerabilities found**" >> security-report.md
        else
          echo "❌ **$VULNS vulnerabilities found**" >> security-report.md
          echo "" >> security-report.md
          echo "### Vulnerabilities:" >> security-report.md
          jq -r '.vulnerabilities.list[] | "- **\(.package.name)** v\(.package.version): \(.advisory.title)"' audit-report.json >> security-report.md
        fi
        
        if [ "$WARNINGS" -gt 0 ]; then
          echo "" >> security-report.md
          echo "### Warnings:" >> security-report.md
          jq -r '.warnings[] | "- \(.kind): \(.package.name) v\(.package.version)"' audit-report.json >> security-report.md
        fi
        
        cat security-report.md
        
        # Fail if vulnerabilities found
        if [ "$VULNS" -gt 0 ]; then
          echo "❌ Security vulnerabilities detected!"
          exit 1
        fi

    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-audit-report
        path: |
          audit-report.json
          security-report.md
        retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v3
      with:
        fail-on-severity: moderate
        comment-summary-in-pr: true

  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny

    - name: Create cargo-deny configuration
      run: |
        cat > deny.toml << 'EOF'
        [advisories]
        db-path = "~/.cargo/advisory-db"
        db-urls = ["https://github.com/rustsec/advisory-db"]
        vulnerability = "deny"
        unmaintained = "warn"
        yanked = "deny"
        notice = "warn"
        ignore = [
            # Add any advisory IDs you want to ignore
        ]

        [licenses]
        unlicensed = "deny"
        allow = [
            "MIT",
            "Apache-2.0",
            "Apache-2.0 WITH LLVM-exception",
            "BSD-2-Clause",
            "BSD-3-Clause",
            "ISC",
            "Unicode-DFS-2016",
        ]
        deny = []
        copyleft = "warn"
        allow-osi-fsf-free = "neither"
        default = "deny"
        confidence-threshold = 0.8

        [bans]
        multiple-versions = "warn"
        wildcards = "allow"
        highlight = "all"
        workspace-default-features = "allow"
        external-default-features = "allow"
        allow = []
        deny = []
        skip = []
        skip-tree = []

        [sources]
        unknown-registry = "warn"
        unknown-git = "warn"
        allow-registry = ["https://github.com/rust-lang/crates.io-index"]
        allow-git = []
        EOF

    - name: Run cargo-deny
      run: |
        echo "🔍 Running supply chain security checks..."
        cargo deny check --hide-inclusion-graph

    - name: Check for multiple versions of same dependency
      run: |
        echo "🔍 Checking for duplicate dependencies..."
        cargo tree --duplicates --depth 1 || true

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Run analysis
      uses: ossf/scorecard-action@v2.3.1
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true

    - name: Upload to code-scanning
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: results.sarif