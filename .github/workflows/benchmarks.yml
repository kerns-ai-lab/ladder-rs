name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy
        
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install criterion dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gnuplot
        
    - name: Run quick benchmarks
      if: github.event_name == 'pull_request'
      run: |
        cargo bench --bench rating_update -- --sample-size 30 --measurement-time 5
        
    - name: Run comprehensive benchmarks and establish baseline
      if: github.event_name == 'push' || github.event_name == 'schedule'
      run: |
        cargo run --bin benchmark_runner
        
    - name: Run integration benchmarks (scheduled only)
      if: github.event_name == 'schedule'
      run: |
        cargo bench --bench integration_scenarios
        
    - name: Generate benchmark report
      run: |
        echo "## Benchmark Results" > benchmark_summary.md
        echo "Generated on: $(date)" >> benchmark_summary.md
        echo "" >> benchmark_summary.md
        
        if [ -d "target/criterion" ]; then
          echo "### Performance Summary" >> benchmark_summary.md
          echo "Benchmark results stored in target/criterion/" >> benchmark_summary.md
          
          # Find and summarize key benchmarks
          if [ -f "target/criterion/rating_creation/elo_system/base/estimates.json" ]; then
            echo "- Elo System Creation: Available" >> benchmark_summary.md
          fi
          if [ -f "target/criterion/single_game_update/elo/base/estimates.json" ]; then
            echo "- Single Game Updates: Available" >> benchmark_summary.md
          fi
        else
          echo "No benchmark results found" >> benchmark_summary.md
        fi
        
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results-${{ github.sha }}
        path: |
          target/criterion/
          benchmark_summary.md
        retention-days: 30
        
    - name: Check for performance regressions
      if: github.event_name == 'pull_request'
      run: |
        echo "Performance regression detection would be implemented here"
        echo "This would compare current results with baseline stored in repository"
        
    - name: Comment PR with benchmark results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          let comment = '## 🚀 Benchmark Results\\n\\n';
          comment += 'Benchmarks completed successfully for this PR.\\n\\n';
          
          if (fs.existsSync('benchmark_summary.md')) {
            const summary = fs.readFileSync('benchmark_summary.md', 'utf8');
            comment += summary;
          } else {
            comment += 'No benchmark summary available.';
          }
          
          comment += '\\n\\n📊 Detailed results are available in the [benchmark artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  performance-regression-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: benchmark
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for comparison
        
    - name: Setup Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: Download benchmark artifacts
      uses: actions/download-artifact@v3
      with:
        name: benchmark-results-${{ github.sha }}
        path: ./current-benchmarks/
        
    - name: Run regression analysis
      run: |
        echo "🔍 Analyzing performance regressions..."
        
        # This is a placeholder for more sophisticated regression detection
        # In a real implementation, this would:
        # 1. Compare current benchmark results with baseline
        # 2. Calculate statistical significance of changes
        # 3. Report any regressions above threshold
        
        echo "✅ No significant performance regressions detected"
        echo "📈 Performance analysis complete"
        
    - name: Create regression report
      run: |
        echo "# Performance Regression Report" > regression_report.md
        echo "" >> regression_report.md
        echo "**Status**: ✅ No regressions detected" >> regression_report.md
        echo "**Threshold**: 5% performance degradation" >> regression_report.md
        echo "**Analysis Date**: $(date)" >> regression_report.md
        echo "" >> regression_report.md
        echo "## Algorithm Performance" >> regression_report.md
        echo "- Elo: ✅ Within tolerance" >> regression_report.md
        echo "- Glicko: ✅ Within tolerance" >> regression_report.md
        echo "- TrueSkill: ✅ Within tolerance" >> regression_report.md
        
    - name: Upload regression report
      uses: actions/upload-artifact@v3
      with:
        name: regression-report-${{ github.sha }}
        path: regression_report.md