[package]
name = "ladder-rs-server"
version = "0.1.0"
edition = "2021"
authors = ["Zanion"]
license = "MIT"
description = "Axum HTTP server for ladder-rs platform"

[dependencies]
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
